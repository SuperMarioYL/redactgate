<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="架构：Coding Agent → RedactGate 代理（检测+掩码+审计）→ Model API">
  <defs>
    <marker id="ah-d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5A5A66"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="360" rx="16" fill="#1D1D1F"/>
  <text x="32" y="40" font-size="15" font-weight="700" fill="#F5F5F7">RedactGate — 出站脱敏数据流</text>
  <text x="32" y="60" font-size="12" font-weight="500" fill="#A1A1A8">单进程 · 0 常驻服务 · 0 容器 · 数据不出境</text>

  <!-- top flow connectors -->
  <g stroke="#3A3A44" stroke-width="1.6" fill="none">
    <line x1="186" y1="130" x2="270" y2="130" marker-end="url(#ah-d)"/>
    <line x1="610" y1="130" x2="710" y2="130" marker-end="url(#ah-d)"/>
  </g>
  <text x="228" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#A1A1A8">出站文本</text>
  <text x="228" y="148" text-anchor="middle" font-size="10" fill="#7A7A82">diff / 请求体</text>
  <text x="660" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#5FE3BE">脱敏后转发</text>

  <!-- Coding Agent -->
  <rect x="32" y="92" width="154" height="76" rx="15" fill="#8985FF" fill-opacity="0.16" stroke="#8985FF" stroke-width="1.5"/>
  <text x="109" y="124" text-anchor="middle" font-size="14" font-weight="600" fill="#B7B4FF">Coding Agent</text>
  <text x="109" y="146" text-anchor="middle" font-size="11" fill="#A1A1A8">Claude Code / Codex</text>

  <!-- RedactGate proxy container -->
  <rect x="270" y="84" width="340" height="220" rx="16" fill="#F87171" fill-opacity="0.07" stroke="#F87171" stroke-width="1.5"/>
  <text x="440" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#FCA5A5">RedactGate proxy.py · 本地拦截</text>

  <!-- inner: detectors -->
  <rect x="290" y="124" width="138" height="64" rx="13" fill="#FBBF24" fill-opacity="0.16" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="359" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#FCD34D">detectors/</text>
  <text x="359" y="170" text-anchor="middle" font-size="10" fill="#E5B84B">CN-PII + 校验位</text>

  <!-- inner: redactor -->
  <rect x="452" y="124" width="138" height="64" rx="13" fill="#F87171" fill-opacity="0.16" stroke="#F87171" stroke-width="1.5"/>
  <text x="521" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#FCA5A5">redactor.py</text>
  <text x="521" y="170" text-anchor="middle" font-size="10" fill="#F0A0A0">字段级掩码</text>

  <!-- detectors -> redactor -->
  <line x1="428" y1="156" x2="452" y2="156" stroke="#3A3A44" stroke-width="1.5" fill="none" marker-end="url(#ah-d)"/>

  <!-- inner: audit -->
  <rect x="290" y="212" width="300" height="62" rx="13" fill="#2DC79A" fill-opacity="0.14" stroke="#2DC79A" stroke-width="1.5"/>
  <text x="440" y="238" text-anchor="middle" font-size="12" font-weight="600" fill="#5FE3BE">audit.py → audit.jsonl</text>
  <text x="440" y="258" text-anchor="middle" font-size="10" fill="#5FE3BE">谁 · 哪一行 · 掩了什么类型 · 校验位状态（永不记原值）</text>

  <!-- redactor -> audit -->
  <line x1="521" y1="188" x2="521" y2="212" stroke="#3A3A44" stroke-width="1.5" fill="none" marker-end="url(#ah-d)"/>

  <!-- Model API -->
  <rect x="710" y="92" width="138" height="76" rx="15" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-width="1.5"/>
  <text x="779" y="124" text-anchor="middle" font-size="14" font-weight="600" fill="#8FC5FF">Model API</text>
  <text x="779" y="146" text-anchor="middle" font-size="11" fill="#A1A1A8">云端模型（境外）</text>

  <!-- rules feed -->
  <rect x="710" y="212" width="138" height="62" rx="13" fill="#4DA3FF" fill-opacity="0.12" stroke="#4DA3FF" stroke-width="1.5"/>
  <text x="779" y="238" text-anchor="middle" font-size="12" font-weight="600" fill="#8FC5FF">rules.py</text>
  <text x="779" y="258" text-anchor="middle" font-size="10" fill="#A1A1A8">default.yaml + 自定义</text>
  <line x1="710" y1="243" x2="592" y2="200" stroke="#3A3A44" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#ah-d)"/>

  <!-- footnote -->
  <rect x="32" y="306" width="816" height="34" rx="10" fill="#F87171" fill-opacity="0.08" stroke="#F87171" stroke-width="1"/>
  <text x="440" y="328" text-anchor="middle" font-size="11.5" font-weight="500" fill="#FCA5A5">只对通过校验位（GB 11643 / Luhn / mod-11-2）的串脱敏 —— 普通 18 位数字不误掩，业务逻辑原样进模型</text>
</svg>
