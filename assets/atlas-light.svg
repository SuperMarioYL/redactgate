<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="架构：Coding Agent → RedactGate 代理（检测+掩码+审计）→ Model API">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
    <marker id="ah-l-r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="360" rx="16" fill="#F5F5F7"/>
  <text x="32" y="40" font-size="15" font-weight="700" fill="#1D1D1F">RedactGate — 出站脱敏数据流</text>
  <text x="32" y="60" font-size="12" font-weight="500" fill="#6E6E73">单进程 · 0 常驻服务 · 0 容器 · 数据不出境</text>

  <!-- top flow connectors -->
  <g stroke="#C9C9D0" stroke-width="1.6" fill="none">
    <line x1="186" y1="130" x2="270" y2="130" marker-end="url(#ah-l)"/>
    <line x1="610" y1="130" x2="710" y2="130" marker-end="url(#ah-l)"/>
  </g>
  <text x="228" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#6E6E73">出站文本</text>
  <text x="228" y="148" text-anchor="middle" font-size="10" fill="#9A9AA0">diff / 请求体</text>
  <text x="660" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#0B6B53">脱敏后转发</text>

  <!-- Coding Agent -->
  <rect x="32" y="92" width="154" height="76" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5"/>
  <text x="109" y="124" text-anchor="middle" font-size="14" font-weight="600" fill="#4B3FC4">Coding Agent</text>
  <text x="109" y="146" text-anchor="middle" font-size="11" fill="#6E6E73">Claude Code / Codex</text>

  <!-- RedactGate proxy container -->
  <rect x="270" y="84" width="340" height="220" rx="16" fill="#DC2626" fill-opacity="0.05" stroke="#DC2626" stroke-width="1.5"/>
  <text x="440" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#B91C1C">RedactGate proxy.py · 本地拦截</text>

  <!-- inner: detectors -->
  <rect x="290" y="124" width="138" height="64" rx="13" fill="#F59E0B" fill-opacity="0.14" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="359" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#B45309">detectors/</text>
  <text x="359" y="170" text-anchor="middle" font-size="10" fill="#92400E">CN-PII + 校验位</text>

  <!-- inner: redactor -->
  <rect x="452" y="124" width="138" height="64" rx="13" fill="#DC2626" fill-opacity="0.12" stroke="#DC2626" stroke-width="1.5"/>
  <text x="521" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#B91C1C">redactor.py</text>
  <text x="521" y="170" text-anchor="middle" font-size="10" fill="#991B1B">字段级掩码</text>

  <!-- detectors -> redactor -->
  <line x1="428" y1="156" x2="452" y2="156" stroke="#C9C9D0" stroke-width="1.5" fill="none" marker-end="url(#ah-l)"/>

  <!-- inner: audit -->
  <rect x="290" y="212" width="300" height="62" rx="13" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5"/>
  <text x="440" y="238" text-anchor="middle" font-size="12" font-weight="600" fill="#0B6B53">audit.py → audit.jsonl</text>
  <text x="440" y="258" text-anchor="middle" font-size="10" fill="#0B6B53">谁 · 哪一行 · 掩了什么类型 · 校验位状态（永不记原值）</text>

  <!-- redactor -> audit -->
  <line x1="521" y1="188" x2="521" y2="212" stroke="#C9C9D0" stroke-width="1.5" fill="none" marker-end="url(#ah-l)"/>

  <!-- Model API -->
  <rect x="710" y="92" width="138" height="76" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5"/>
  <text x="779" y="124" text-anchor="middle" font-size="14" font-weight="600" fill="#0A4F9E">Model API</text>
  <text x="779" y="146" text-anchor="middle" font-size="11" fill="#6E6E73">云端模型（境外）</text>

  <!-- rules feed -->
  <rect x="710" y="212" width="138" height="62" rx="13" fill="#0071E3" fill-opacity="0.08" stroke="#0071E3" stroke-width="1.5"/>
  <text x="779" y="238" text-anchor="middle" font-size="12" font-weight="600" fill="#0A4F9E">rules.py</text>
  <text x="779" y="258" text-anchor="middle" font-size="10" fill="#6E6E73">default.yaml + 自定义</text>
  <line x1="710" y1="243" x2="592" y2="200" stroke="#C9C9D0" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#ah-l)"/>

  <!-- footnote: only checksum-valid masked -->
  <rect x="32" y="306" width="816" height="34" rx="10" fill="#DC2626" fill-opacity="0.05" stroke="#DC2626" stroke-width="1"/>
  <text x="440" y="328" text-anchor="middle" font-size="11.5" font-weight="500" fill="#B91C1C">只对通过校验位（GB 11643 / Luhn / mod-11-2）的串脱敏 —— 普通 18 位数字不误掩，业务逻辑原样进模型</text>
</svg>
