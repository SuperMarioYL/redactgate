name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # Build the wheel + sdist and stage them into dist/. publish_repo.sh attaches
  # dist/* to the GitHub Release; this job only produces the artifacts.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  # Opt-in PyPI publish via Trusted Publishing. A fresh repo has no Trusted
  # Publisher registered, so an always-on job would fail the first release with
  # `invalid-publisher`. Gate it behind the PYPI_PUBLISH repo variable: set
  # `PYPI_PUBLISH=true` and register the Trusted Publisher when you actually
  # want to ship to PyPI (see BUILD_SETUP_NEXT_STEPS.md / pyproject homepage).
  pypi:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
