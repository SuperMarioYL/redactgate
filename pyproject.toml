[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "redactgate"
version = "0.2.0"
description = "Local outbound redaction gateway that masks checksum-validated Chinese PII before your coding agent sends it offshore."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "SuperMarioYL" }]
keywords = [
    "pii",
    "redaction",
    "dlp",
    "coding-agent",
    "claude-code",
    "compliance",
    "proxy",
    "chinese-pii",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: Chinese (Simplified)",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.1,<9",
    "httpx>=0.27,<1",
    "rich>=13.7,<14",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9"]

[project.urls]
Homepage = "https://github.com/SuperMarioYL/redactgate"
Repository = "https://github.com/SuperMarioYL/redactgate"
Issues = "https://github.com/SuperMarioYL/redactgate/issues"

[project.scripts]
redactgate = "redactgate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/redactgate"]

[tool.hatch.build.targets.wheel.force-include]
"rules/default.yaml" = "redactgate/_bundled_rules/default.yaml"

[tool.hatch.build.targets.sdist]
include = [
    "src/redactgate",
    "rules",
    "tests",
    "examples",
    "README.md",
    "README.en.md",
    "LICENSE",
    "VERSION",
    "CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
